; ==============================================================================
; LOCALADZONE — PRODUCTION SUPERVISOR CONFIGURATION (HORIZON & QUEUES)
; Manages high-throughput background queues for media, billing & notifications
; ==============================================================================

[program:localadzone-horizon]
process_name=%(program_name)s
command=php /var/www/localadzone/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/localadzone-horizon.log
stopwaitsecs=3600
stopsignal=SIGTERM

; ------------------------------------------------------------------------------
; Fallback Queue Worker (if Horizon is not installed in standard minimal runtime)
; ------------------------------------------------------------------------------
[program:localadzone-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/localadzone/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --queue=high,billing,media,notifications,default
autostart=true
autorestart=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/localadzone-worker.log
stopwaitsecs=30
stopsignal=SIGTERM

