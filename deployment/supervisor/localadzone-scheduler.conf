; ==============================================================================
; LOCALADZONE — PRODUCTION SUPERVISOR CONFIGURATION (SCHEDULER DAEMON)
; Alternative to crontab: runs php artisan schedule:work in persistent daemon
; ==============================================================================

[program:localadzone-scheduler]
process_name=%(program_name)s
command=php /var/www/localadzone/artisan schedule:work
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/localadzone-scheduler.log
stopwaitsecs=60
stopsignal=SIGTERM
