; ==============================================================================
; LOCALADZONE — PRODUCTION PHP-FPM POOL CONFIGURATION
; Pool: localadzone (PHP 8.3 / 8.4)
; ==============================================================================

[localadzone]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Management (Tuned for 4-8 vCPU / 8-16 GB RAM production node)
pm = dynamic
pm.max_children = 80
pm.start_servers = 20
pm.min_spare_servers = 10
pm.max_spare_servers = 30
pm.max_requests = 1000

; Health & Telemetry
pm.status_path = /php_status
ping.path = /ping
ping.response = pong

; Timeouts & Buffering
request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/localadzone-slow.log

; PHP Overrides
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 14M
php_admin_value[max_execution_time] = 60
php_admin_value[expose_php] = Off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/localadzone-error.log

; Production Zend OPcache (Recommended values in php.ini)
; opcache.enable=1
; opcache.enable_cli=1
; opcache.memory_consumption=256
; opcache.interned_strings_buffer=16
; opcache.max_accelerated_files=30000
; opcache.validate_timestamps=0
; opcache.save_comments=1
; opcache.fast_shutdown=1
