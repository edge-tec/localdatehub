# ==============================================================================
# LOCALADZONE — PRODUCTION NGINX SERVER CONFIGURATION
# High-concurrency, hardened SSL, rate-limited configuration for Laravel 13
# ==============================================================================

# Rate Limiting Zones (Defined in http block or included here)
limit_req_zone $binary_remote_addr zone=laz_general:20m rate=40r/s;
limit_req_zone $binary_remote_addr zone=laz_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=laz_search:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=laz_contact:10m rate=6r/m;

# Upstream PHP-FPM Socket
upstream php_fpm_localadzone {
    server unix:/run/php/php8.3-fpm.sock;
    keepalive 32;
}

# HTTP — Canonical Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name localadzone.com www.localadzone.com;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/localadzone/public;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Production Application Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localadzone.com;

    root /var/www/localadzone/public;
    index index.php index.html;

    # --------------------------------------------------------------------------
    # SSL / TLS Hardening
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/localadzone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localadzone.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/localadzone.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --------------------------------------------------------------------------
    # Enterprise Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # --------------------------------------------------------------------------
    # Performance & Payload Limits
    # --------------------------------------------------------------------------
    client_max_body_size 12M;
    client_body_buffer_size 128k;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # General Rate Limiting
    limit_req zone=laz_general burst=50 nodelay;

    # --------------------------------------------------------------------------
    # Route Rules & Static Asset Caching
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # High-rate limit for sensitive auth endpoints
    location ~* ^/(login|register|password/reset|two-factor) {
        limit_req zone=laz_auth burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rate limit for search queries to prevent scraping
    location ~* ^/(search|api/v1/search) {
        limit_req zone=laz_search burst=15 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Rate limit for protected contact form
    location ~* ^/listings/[^/]+/contact {
        limit_req zone=laz_contact burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets & Media Caching (Vite immutable builds)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri =404;
    }

    # Sitemaps & Robots caching (30 minutes)
    location ~* ^/(sitemap\.xml|sitemaps/.*\.xml|robots\.txt)$ {
        expires 30m;
        add_header Cache-Control "public, max-age=1800";
        try_files $uri /index.php?$query_string;
    }

    # --------------------------------------------------------------------------
    # PHP-FPM Execution
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass php_fpm_localadzone;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 5s;
    }

    # --------------------------------------------------------------------------
    # Deny Access to Hidden / Sensitive Files
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(storage/logs|database|tests|docs|deployment|bin) {
        deny all;
        return 404;
    }
}
