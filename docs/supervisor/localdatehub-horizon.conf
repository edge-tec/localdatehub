; LocalDateHub Laravel Horizon Supervisor Configuration (Staging / Production)
; IMPORTANT: Use EITHER this Horizon config OR localdatehub-workers.conf — NEVER both at the same time,
; otherwise duplicate queue consumers will run against Redis.

[program:localdatehub-horizon]
process_name=%(program_name)s
command=php /www/wwwroot/localdatehub.com/artisan horizon
autostart=true
autorestart=true
user=www
redirect_stderr=true
stdout_logfile=/www/wwwroot/localdatehub.com/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600

