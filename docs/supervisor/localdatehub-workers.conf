; LocalDateHub Supervisor Worker Configuration (Staging / Production)
; Copy to /etc/supervisor/conf.d/localdatehub-workers.conf only when authorized.

[program:localdatehub-core]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/localdatehub.com/artisan queue:work redis --queue=critical,sweeping,verification,monitoring,default --sleep=1 --tries=3 --backoff=5 --timeout=90 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=/www/wwwroot/localdatehub.com/storage/logs/worker-core.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:localdatehub-analytics]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/localdatehub.com/artisan queue:work redis --queue=analytics --sleep=1 --tries=3 --backoff=5 --timeout=30 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=4
redirect_stderr=true
stdout_logfile=/www/wwwroot/localdatehub.com/storage/logs/worker-analytics.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:localdatehub-comms]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/localdatehub.com/artisan queue:work redis --queue=notifications,emails,advertising,maintenance --sleep=2 --tries=3 --backoff=10 --timeout=60 --max-time=3600 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=/www/wwwroot/localdatehub.com/storage/logs/worker-comms.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600

